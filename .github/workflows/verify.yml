name: Verify (lint · typecheck · tests · parity)

# Quality gate for the codebase itself — complements build-exe.yml (which
# packages the Windows installers). Runs the same `npm run verify` the README
# documents: ESLint, tsc --noEmit, the Vitest suite and the backend parity
# check (prisma ↔ schema.sql ↔ bootstrap.ts DDL ↔ API surface).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    {}

permissions:
  contents: read

jobs:
  verify:
    name: lint + typecheck + test + parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Verify
        run: npm run verify

  # The in-process WhatsApp engine's session store + engine glue are pure
  # Rust (no GTK) and carry their own behavioural tests — run them on every
  # push. src-tauri gets a full `cargo check` so Windows-only breakage (the
  # tag build) is caught at push time, not at release time.
  rust:
    name: rust — wa engine tests + src-tauri check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            scripts/wa-engine-check
            src-tauri

      - name: WhatsApp engine store tests (no GTK needed)
        run: cargo test --manifest-path scripts/wa-engine-check/Cargo.toml

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: cargo check src-tauri (full app compile gate)
        run: cargo check --manifest-path src-tauri/Cargo.toml
