name: Build Windows EXE (PS-AMS)

# Builds the offline Windows desktop app (Tauri v2) into NSIS + MSI
# installers plus a portable no-install zip (exe + portable.flag).
# Artifacts are attached to every run; pushing a tag like v1.2.0 also
# publishes a GitHub Release with all three deliverables.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    {}

permissions:
  contents: write

jobs:
  build:
    name: Tauri build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            whatsapp-bot

      - name: Install frontend dependencies
        run: bun install

      # Bun skips untrusted lifecycle scripts, so @prisma/client is not
      # auto-generated on install. trustedDependencies in package.json
      # now whitelists Prisma; this explicit generate is a deterministic
      # second belt so `next build` type checking always passes.
      - name: Generate Prisma client
        run: bunx prisma generate

      # Native Rust WhatsApp linked-device sidecar (whatsapp-rust engine —
      # no Node.js). Lives OUTSIDE the src-tauri workspace with its own
      # Cargo.lock: the app links libsqlite3-sys 0.28 (sqlx) while the
      # engine links 0.37 (diesel) — Cargo's `links` rule forbids both in
      # one dependency graph. Must exist before `tauri build`
      # (bundle.externalBin expects it with the target-triple suffix).
      - name: Build WhatsApp sidecar (native Rust)
        shell: bash
        run: |
          cd whatsapp-bot
          cargo build --release
          mkdir -p ../src-tauri/binaries
          cp target/release/whatsapp-bot.exe ../src-tauri/binaries/whatsapp-bot-x86_64-pc-windows-msvc.exe

      - name: Build Tauri app (static export + NSIS/MSI)
        run: bun run tauri build

      - name: Package portable edition (no-install zip)
        shell: pwsh
        run: |
          $stage = "portable-stage/PS-AMS-Portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/ps-ams.exe" "$stage/PS-AMS.exe"
          Copy-Item "src-tauri/binaries/whatsapp-bot-x86_64-pc-windows-msvc.exe" "$stage/whatsapp-bot.exe"
          New-Item -ItemType File -Force -Path "$stage/portable.flag" | Out-Null
          Copy-Item "docs/README-portable.txt" "$stage/README.txt"
          $zip = if ($env:GITHUB_REF_NAME -like "v*") { "PS-AMS_${env:GITHUB_REF_NAME}_portable_x64.zip" } else { "PS-AMS_portable_x64.zip" }
          Compress-Archive -Path $stage/* -DestinationPath $zip -Force
          Write-Host "Portable package ready: $zip"

      - name: Upload installers + portable (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PS-AMS-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            PS-AMS_*_portable_x64.zip
            PS-AMS_portable_x64.zip

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            PS-AMS_*_portable_x64.zip
          generate_release_notes: true
