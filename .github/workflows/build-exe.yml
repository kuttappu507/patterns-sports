name: Build Windows EXE (PS-AMS)

# Builds the offline Windows desktop app (Tauri v2) into NSIS + MSI installers.
# Artifacts are attached to every run; pushing a tag like v1.0.0 also
# publishes a GitHub Release with the installers.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    {}

permissions:
  contents: write

jobs:
  build:
    name: Tauri build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (static export + NSIS/MSI)
        run: bun run tauri build

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PS-AMS-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
