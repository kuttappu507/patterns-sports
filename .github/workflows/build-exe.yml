name: Build Windows EXE (PS-AMS)

# Builds the offline Windows desktop app (Tauri v2) into NSIS + MSI
# installers plus a portable no-install zip (exe + portable.flag).
# Artifacts are attached to every run; pushing a tag like v1.2.0 also
# publishes a GitHub Release with all three deliverables.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    {}

permissions:
  contents: write

jobs:
  build:
    name: Tauri build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Bun skips untrusted lifecycle scripts, so @prisma/client is not
      # auto-generated on install. trustedDependencies in package.json
      # now whitelists Prisma; this explicit generate is a deterministic
      # second belt so `next build` type checking always passes.
      - name: Generate Prisma client
        run: bunx prisma generate

      # The WhatsApp linked-device engine runs IN-PROCESS since PS-055
      # (no sidecar exe is built or bundled anymore).

      - name: Build Tauri app (static export + NSIS/MSI)
        run: bun run tauri build

      - name: Package portable edition (no-install zip)
        shell: pwsh
        run: |
          $stage = "portable-stage/PS-AMS-Portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/ps-ams.exe" "$stage/PS-AMS.exe"
          New-Item -ItemType File -Force -Path "$stage/portable.flag" | Out-Null
          Copy-Item "docs/README-portable.txt" "$stage/README.txt"
          $zip = if ($env:GITHUB_REF_NAME -like "v*") { "PS-AMS_${env:GITHUB_REF_NAME}_portable_x64.zip" } else { "PS-AMS_portable_x64.zip" }
          Compress-Archive -Path $stage/* -DestinationPath $zip -Force
          Write-Host "Portable package ready: $zip"

      - name: Upload installers + portable (artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PS-AMS-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            PS-AMS_*_portable_x64.zip
            PS-AMS_portable_x64.zip

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            PS-AMS_*_portable_x64.zip
          generate_release_notes: true
