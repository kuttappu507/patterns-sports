[package]
name = "wa-engine-check"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The IN-PROCESS feature set — note NO sqlite-storage: the session store is
# our own JSON-file backend, so diesel/libsqlite3-sys never enters the graph.
whatsapp-rust = { version = "0.7", default-features = false, features = [
    "tokio-transport",
    "tokio-runtime",
    "tokio-native",
    "ureq-client",
    "signal",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"
bytes = "1"
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
wacore = { version = "0.7", default-features = false }
wacore-binary = { version = "0.7", default-features = false }

[workspace]
