[package]
name = "ps-ams"
version = "1.9.0"
description = "Pattern Sports Academy Management System — offline-first academy suite"
authors = ["Pattern Sports Academy"]
edition = "2021"

# Standalone package. Since PS-055 the WhatsApp linked-device engine runs
# IN-PROCESS (src/wa_engine.rs) on the whatsapp-rust crate WITHOUT its
# sqlite-storage feature — the pairing session is persisted by our own
# JSON-file backend (src/wa_json_store.rs). That keeps diesel and its
# libsqlite3-sys 0.37 out of this dependency graph (sqlx pins
# libsqlite3-sys 0.30 here; Cargo's `links` rule forbids both in one graph
# — the very reason a sidecar exe existed before v1.9.0).
[workspace]

[lib]
name = "psams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Direct sqlite access for the crash-safe backup/restore core (PS-002/003/006):
# VACUUM INTO snapshots, quick_check verification, WAL checkpointing. The
# version/features align with tauri-plugin-sql's own sqlx (libsqlite3-sys
# 0.28 unifies — one native build, no new C dependencies).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-process WhatsApp engine (PS-055) — no default features: the simd path
# of wacore-binary is nightly-only (stable MSVC), and sqlite-storage would
# pull diesel/libsqlite3-sys 0.37 (see the workspace note above).
wacore = { version = "0.7", default-features = false }
wacore-binary = { version = "0.7", default-features = false }
whatsapp-rust = { version = "0.7", default-features = false, features = [
    "tokio-transport",
    "tokio-runtime",
    "tokio-native",
    "ureq-client",
    "signal",
] }
async-trait = "0.1"
# Engine tasks ride tauri::async_runtime (tokio): spawns, Notify, timers.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
bytes = "1"
base64 = "0.22"
log = "0.4"
chrono = "0.4"
dirs = "5"
# Updater integrity (PS-015): sha256 of the downloaded installer, compared
# against the GitHub release `digest`. Pure Rust — no native build.
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
# Native printing (WebView2 print pipeline). These MUST stay version-aligned
# with the webview2-com / windows-core versions tauri + wry resolve to
# (tauri 2.12 → wry 0.57 → webview2-com 0.39 / windows-core 0.62) so the
# COM interface types unify into one crate instance.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# v1.8.0 (PS-054) — install_update launches the downloaded installer via
# ShellExecuteW: CreateProcessW failed with os error 740 on the perMachine
# NSIS installer (elevation required) and cannot start .msi packages.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
