[package]
name = "ps-ams"
version = "1.6.0"
description = "Pattern Sports Academy Management System — offline-first academy suite"
authors = ["Pattern Sports Academy"]
edition = "2021"

# Standalone package (NOT a workspace with the whatsapp-bot sidecar):
# the app links sqlx (libsqlite3-sys 0.28) while the native sidecar links
# diesel (libsqlite3-sys 0.37) — Cargo's `links` rule forbids both in one
# dependency graph, so the sidecar lives in its own crate at ../whatsapp-bot
# with its own Cargo.lock and is built separately by CI.
[workspace]

[lib]
name = "psams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
