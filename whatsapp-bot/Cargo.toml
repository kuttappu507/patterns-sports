[package]
name = "whatsapp-bot"
version = "1.6.0"
description = "PS-AMS native WhatsApp linked-device sidecar (whatsapp-rust engine, NDJSON over stdio)"
edition = "2021"

[[bin]]
name = "whatsapp-bot"
path = "src/main.rs"

[dependencies]
# Default features minus `simd` — wacore-binary's simd path uses the
# nightly-only portable_simd attribute and fails on stable MSVC.
whatsapp-rust = { version = "0.7", default-features = false, features = [
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "tokio-native",
    "ureq-client",
    "signal",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
serde_json = "1"
base64 = "0.22"
